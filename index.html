<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System</title>
    <script src="script/aframe.min.js"></script>
    <style>
        #ui {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 10;
            font-family: 'Courier New', Courier, monospace;
        }
        #title {
            position: absolute;
            top: 24px; left: 50%;
            transform: translate(-50%);
            color: #fff;
            font-size: 13px;
            letter-spacing: 6px;
            text-transform: uppercase;
        }
        #planet-info {
            position: absolute;
            bottom: 36px; left: 50%;
            transform: translateX(-50%);
            text-align: center;
        }
        #planet-info h2 {
            font-size: 20px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #fff;
        }
        #planet-info p {
            font-size: 11px;
            letter-spacing: 1px;
            color: #aaa;
            margin-top: 6px;
        }
        #controls {
            position: absolute;
            top: 50%; right: 24px;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 6px;
            pointer-events: all;
        }
        #controls button {
            background: rgba(255,255,255,0.1);
            border: 1px solid #ccc;
            color: #fff;
            padding: 6px 14px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
        }
        #controls button:hover {
            background: #fff;
            color: #333;
        }
    </style>
</head>
<body>
    <a-scene cursor="rayOrigin: mouse">
        <!-- ASSETS -->
        <a-assets>
            <img id="sky"         src="texture/2k_stars_milky_way.jpg"/>
            <img id="sun"         src="texture/2k_sun.jpg"/>
            <img id="mercury"     src="texture/2k_mercury.jpg"/>
            <img id="venus"       src="texture/2k_venus_atmosphere.jpg"/>
            <img id="earth"       src="texture/2k_earth_daymap.jpg"/>
            <img id="moon"        src="texture/2k_moon.jpg"/>
            <img id="mars"        src="texture/2k_mars.jpg"/>
            <img id="jupiter"     src="texture/2k_jupiter.jpg"/>
            <img id="saturn"      src="texture/2k_saturn.jpg"/>
            <img id="saturn-ring" src="texture/2k_saturn_ring_alpha.png"/>
            <img id="uranus"      src="texture/2k_uranus.jpg"/>
            <img id="neptune"     src="texture/2k_neptune.jpg"/>
        </a-assets>

        <!-- SKY -->
        <a-sky src="#sky" radius="500" rotation="0 30 0"></a-sky>

        <!-- LIGHTING -->
        <a-light type="point" position="0 0 0" color="#fff5e0" intensity="4" distance="300" decay="1"></a-light>
        <a-light type="ambient" color="#ffffff" intensity="0.5"></a-light>


        <!-- CAMERA -->
        <a-entity camera look-controls wasd-controls position="0 5 40"></a-entity>

        <!-- SUN -->
        <a-sphere position="0 0 0" radius="6"
            src="#sun"
            emissive="#ff6600" emissive-intensity="0.03"
            animation__spin="property: rotation; to: 0 360 0; loop: true; dur: 25000; easing: linear">
        </a-sphere>


        <!-- MERCURY -->
        <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 8800; easing: linear">
            <a-sphere position="8 0 0" radius="0.5" src="#mercury"
                class="planet" data-name="Mercury"
                data-desc="Closest to the Sun · No atmosphere · Extreme temperatures"
                animation__spin="property: rotation; to: 0 360 0; loop: true; dur: 14000; easing: linear">
            </a-sphere>
        </a-entity>

        <!-- VENUS -->
        <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 22500; easing: linear">
            <a-sphere position="11 0 0" radius="0.9" src="#venus"
                class="planet" data-name="Venus"
                data-desc="Hottest planet · 465°C surface · Spins backwards"
                animation__spin="property: rotation; to: 0 -360 0; loop: true; dur: 24000; easing: linear">
            </a-sphere>
        </a-entity>

        <!-- EARTH -->
        <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 36500; easing: linear">
            <a-sphere position="14 0 0" radius="1" src="#earth"
                class="planet" data-name="Earth"
                data-desc="Our home · Only known planet with life · 1 Moon"
                animation__spin="property: rotation; to: 0 360 0; loop: true; dur: 2400; easing: linear">
            </a-sphere>
            <!-- Moon orbit -->
            <a-entity position="14 0 0"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 6550; easing: linear">
                <a-sphere position="2.5 0 0" radius="0.27" src="#moon"
                    animation__spin="property: rotation; to: 0 360 0; loop: true; dur: 6550; easing: linear">
                </a-sphere>
            </a-entity>
        </a-entity>

        <!-- MARS -->
        <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 68700; easing: linear">
            <a-sphere position="17 0 0" radius="0.8" src="#mars"
                class="planet" data-name="Mars"
                data-desc="The Red Planet · Home of Olympus Mons"
                animation__spin="property: rotation; to: 0 360 0; loop: true; dur: 2460; easing: linear">
            </a-sphere>
        </a-entity>

        <!-- JUPITER -->
        <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 433000; easing: linear">
            <a-sphere position="22 0 0" radius="2" src="#jupiter"
                class="planet" data-name="Jupiter"
                data-desc="Largest planet · Great Red Spot storm · 95 moons"
                animation__spin="property: rotation; to: 0 360 0; loop: true; dur: 980; easing: linear">
            </a-sphere>
        </a-entity>

        <!-- SATURN -->
        <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 1075000; easing: linear">
            <a-entity position="27 0 0">
                <a-sphere radius="1.7" src="#saturn"
                    class="planet" data-name="Saturn"
                    data-desc="Lord of the Rings · Least dense planet"
                    animation__spin="property: rotation; to: 0 360 0; loop: true; dur: 1060; easing: linear">
                </a-sphere>
                <a-ring radius-inner="2" radius-outer="3"
                    src="#saturn-ring"
                    rotation="90 0 0"
                    material="src:#saturn-ring; transparent:true; opacity:0.85; side:double">
                </a-ring>
            </a-entity>
        </a-entity>

        <!-- URANUS -->
        <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 3060000; easing: linear">
            <a-sphere position="32 0 0" radius="1.3" src="#uranus"
                class="planet" data-name="Uranus"
                data-desc="Tilted 98° · Rotates on its side · Pale blue methane atmosphere"
                animation__spin="property: rotation; to: 0 360 0; loop: true; dur: 1720; easing: linear">
            </a-sphere>
        </a-entity>

        <!-- NEPTUNE -->
        <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 5980000; easing: linear">
            <a-sphere position="36 0 0" radius="1.2" src="#neptune"
                class="planet" data-name="Neptune"
                data-desc="Farthest planet · Fastest winds at 2,100 km/h"
                animation__spin="property: rotation; to: 0 360 0; loop: true; dur: 1600; easing: linear">
            </a-sphere>
        </a-entity>

    </a-scene>


</body>
</html>
